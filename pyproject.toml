[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "0.1.0"
description = "Open source vulnerability remediation service"
requires-python = ">=3.11"
dependencies = [
  "packaging>=24.2",
  "PyYAML>=6.0.2",
  "json5>=0.10.0",
  "docker==7.2.0",
  "fastapi>=0.115",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.32",
  "openai-agents[docker]==0.14.8",
  "openai==2.26.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.3",
  "ruff>=0.8",
]
sandbox = [
  "openai-agents[docker]==0.14.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["aegis*"]
